<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Eine ToDo-Zeile; erwartet ${row} (TodoViews.TodoRow), optional ${back} als Rücksprung -->
<li th:fragment="row" class="todo-row" th:id="'todo-' + ${row.todo().id}"
    th:classappend="${row.checked()} ? 'is-checked'"
    th:with="action=${row.checked()} ? 'uncheck' : 'check'">
    <form class="todo-check" th:if="${row.canCheck()}" method="post"
          th:action="@{/todos/{id}/{a}(id=${row.todo().id}, a=${action})}"
          th:hx-post="@{/todos/{id}/{a}(id=${row.todo().id}, a=${action})}"
          th:hx-target="'#todo-' + ${row.todo().id}" hx-swap="outerHTML"
          th:data-confirm="${!row.checked() and row.blockedWarning() != null} ? ${row.blockedWarning()}"
          th:data-confirm-label="${!row.checked() and row.blockedWarning() != null} ? 'Trotzdem erledigen'">
        <input type="hidden" name="back" th:value="${back} ?: '/todos'">
        <button type="submit" class="check" th:aria-pressed="${row.checked()}"
                th:title="${row.checked()} ? 'Wieder öffnen' : 'Abhaken'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12.5 4 4 8-9"/></svg>
            <span class="visually-hidden" th:text="${row.checked()} ? 'Wieder öffnen' : 'Abhaken'">Abhaken</span>
        </button>
    </form>
    <span class="check check-static" th:unless="${row.canCheck()}" aria-hidden="true"
          th:classappend="${row.checked()} ? 'is-done'">
        <svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg>
    </span>

    <div class="todo-body">
        <a class="todo-title" th:href="@{/todos/{id}(id=${row.todo().id})}" th:text="${row.todo().title}">Titel</a>
        <div class="todo-meta">
            <span class="prio" th:if="${row.todo().priority.name() != 'NORMAL'}"
                  th:classappend="'prio-' + ${#strings.toLowerCase(row.todo().priority.name())}"
                  th:text="${row.todo().priority.label()}">Hoch</span>
            <span class="pill pill-progress" th:if="${row.todo().status.name() == 'IN_PROGRESS'}">In Arbeit</span>
            <span class="pill" th:if="${row.todo().status.name() == 'DISCARDED'}">Verworfen</span>
            <span class="due" th:if="${row.dueLabel() != null}"
                  th:classappend="'due-' + ${#strings.toLowerCase(row.timing().name())}"
                  th:text="${row.dueLabel()}">heute fällig</span>
            <span class="pill" th:if="${row.progress() != null}" th:text="${row.progress()}">2 von 3</span>
            <span class="pill pill-blocked" th:if="${row.blockedWarning() != null}">blockiert</span>
            <span class="pill" th:if="${row.childProgress() != null}" th:title="'Unteraufgaben erledigt: ' + ${row.childProgress()}">
                <svg class="pill-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v12a2 2 0 0 0 2 2h10M14 14l4 4-4 4"/></svg>
                <span th:text="${row.childProgress()}">3/5</span>
            </span>
            <svg th:if="${row.todo().rrule != null}" class="occ-lock" viewBox="0 0 24 24" role="img" aria-label="Wiederkehrend">
                <path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/>
            </svg>
            <svg th:if="${row.todo().privateTodo}" class="occ-lock" viewBox="0 0 24 24" role="img" aria-label="Privat">
                <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
            </svg>
            <th:block th:each="tag : ${row.todo().tags}">
                <span class="tag" th:text="'#' + ${tag}">#haus</span>
            </th:block>
        </div>
        <p class="row-error" role="alert" th:if="${rowError != null}" th:text="${rowError}">Fehler</p>
    </div>

    <ul class="todo-assignees" th:unless="${#lists.isEmpty(row.assignees())}">
        <th:block th:each="a : ${row.assignees()}">
            <li th:replace="~{todos/fragments :: assignee(${a})}"></li>
        </th:block>
    </ul>
</li>

<!-- Ein Zuständiger als Chip -->
<li th:fragment="assignee(a)" class="assignee" th:classappend="'assignee-' + ${a.kind()}"
    th:style="${a.color() != null} ? |--member-color: ${a.color()}|">
    <svg th:if="${a.kind() == 'role'}" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3"/><path d="M3.5 18a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5M18 13.5a5.5 5.5 0 0 1 2.5 4.5"/>
    </svg>
    <svg th:if="${a.kind() == 'contact'}" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M8 16.5a4 4 0 0 1 8 0"/>
    </svg>
    <span th:text="${a.label()}">Lena</span>
</li>

<!-- Kopf der ToDo-Ansichten mit Umschalter Liste | Board | Baum; erwartet ${view} und ${viewQuery} -->
<div th:fragment="viewHead(subtitle)" class="page-head">
    <div>
        <h1>ToDos</h1>
        <p th:text="${subtitle}">3 Einträge</p>
    </div>
    <div class="page-actions">
        <nav class="segmented" aria-label="Ansicht">
            <a th:href="${'/todos' + viewQuery}" th:aria-current="${view == 'list'} ? 'page'">Liste</a>
            <a th:href="${'/todos/board' + viewQuery}" th:aria-current="${view == 'board'} ? 'page'">Board</a>
            <a th:href="${'/todos/tree' + viewQuery}" th:aria-current="${view == 'tree'} ? 'page'">Baum</a>
        </nav>
        <a class="button" th:if="${canCreate}" th:href="@{/todos/new}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            ToDo
        </a>
    </div>
</div>

<!-- Filterleiste; erwartet ${filter}, ${labels}, ${tags} und die Auswahllisten -->
<form th:fragment="filters(target)" class="todo-filters" th:action="@{${target}}" method="get" data-auto-submit role="search">
    <label class="search">
        <span class="visually-hidden">ToDos durchsuchen</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input class="input" type="search" name="q" placeholder="Suchen" th:value="${filter.text()}">
    </label>
    <label class="filter">
        <span class="visually-hidden">Beteiligung</span>
        <select name="involvement">
            <option th:each="i : ${involvements}" th:value="${i.name()}" th:text="${i.label()}"
                    th:selected="${filter.involvement() == i}">Alle</option>
        </select>
    </label>
    <label class="filter">
        <span class="visually-hidden">Zuständig</span>
        <select name="assignee">
            <option value="">Alle Zuständigen</option>
            <optgroup label="Mitglieder" th:unless="${#lists.isEmpty(labels.members())}">
                <option th:each="m : ${labels.members()}" th:value="'member:' + ${m.id}" th:text="${m.name}"
                        th:selected="${assigneeKey == 'member:' + m.id}">Lena</option>
            </optgroup>
            <optgroup label="Rollen">
                <option th:each="r : ${labels.roles()}" th:value="'role:' + ${r.id}" th:text="${r.name}"
                        th:selected="${assigneeKey == 'role:' + r.id}">Eltern</option>
            </optgroup>
            <optgroup label="Kontakte" th:unless="${#lists.isEmpty(labels.contacts())}">
                <option th:each="c : ${labels.contacts()}" th:value="'contact:' + ${c.id}" th:text="${c.name}"
                        th:selected="${assigneeKey == 'contact:' + c.id}">Meier</option>
            </optgroup>
        </select>
    </label>
    <label class="filter">
        <span class="visually-hidden">Zeitlage</span>
        <select name="timing">
            <option value="">Jede Zeitlage</option>
            <option th:each="t : ${timings}" th:value="${t.name()}" th:text="${t.label()}"
                    th:selected="${filter.timing() == t}">Überfällig</option>
        </select>
    </label>
    <label class="filter">
        <span class="visually-hidden">Status</span>
        <select name="status">
            <option value="">Jeder Status</option>
            <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label()}"
                    th:selected="${filter.status() == s}">Offen</option>
        </select>
    </label>
    <label class="filter">
        <span class="visually-hidden">Priorität</span>
        <select name="priority">
            <option value="">Jede Priorität</option>
            <option th:each="p : ${priorities}" th:value="${p.name()}" th:text="${p.label()}"
                    th:selected="${filter.priority() == p}">Hoch</option>
        </select>
    </label>
    <label class="filter" th:unless="${#lists.isEmpty(tags)}">
        <span class="visually-hidden">Schlagwort</span>
        <select name="tag">
            <option value="">Alle Schlagworte</option>
            <option th:each="t : ${tags}" th:value="${t}" th:text="'#' + ${t}"
                    th:selected="${filter.tag() == t}">#haus</option>
        </select>
    </label>
    <label class="choice choice-compact">
        <input type="checkbox" name="closed" value="true" th:checked="${filter.includeClosed()}">
        <span>Abgeschlossene zeigen</span>
    </label>
    <button type="submit" class="button button-ghost button-small">Filtern</button>
    <a class="filter-reset" th:if="${filter.isActive()}" th:href="@{${target}}">Zurücksetzen</a>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ToDos')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='todos')}"></header>
<main class="todos-page">
    <div th:replace="~{todos/fragments :: viewHead(${count == 1} ? '1 Eintrag' : ${count} + ' Einträge')}"></div>
    <form th:replace="~{todos/fragments :: filters('/todos')}"></form>

    <div class="sheet sheet-empty" th:if="${#lists.isEmpty(groups)}">
        <th:block th:if="${filter.isActive()}">Kein ToDo passt zu diesen Filtern.</th:block>
        <th:block th:unless="${filter.isActive()}">Nichts zu tun. Neue Aufgaben legst du über „ToDo“ an.</th:block>
    </div>

    <section class="todo-group" th:each="group : ${groups}"
             th:classappend="'todo-group-' + ${#strings.toLowerCase(group.timing().name())}">
        <h2>
            <span th:text="${group.timing().label()}">Überfällig</span>
            <span class="count" th:text="${#lists.size(group.rows())}">2</span>
        </h2>
        <ul class="todo-list">
            <th:block th:each="row : ${group.rows()}">
                <li th:replace="~{todos/fragments :: row}"></li>
            </th:block>
        </ul>
    </section>
</main>
<div th:replace="~{fragments/layout :: confirmDialog}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

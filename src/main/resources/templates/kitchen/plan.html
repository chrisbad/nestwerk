<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Essensplan')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='kitchen')}"></header>
<main class="event-main kitchen-main plan-main">
    <nav th:replace="~{kitchen/fragments :: tabs('plan')}"></nav>
    <div class="page-head">
        <div>
            <h1>Essensplan</h1>
            <p class="plan-week-nav">
                <a class="button button-ghost button-small" th:href="@{/kitchen/plan(week=${previous})}" aria-label="Vorige Woche">‹</a>
                <strong th:text="${weekLabel}">12.10. – 18.10.2026</strong>
                <a class="button button-ghost button-small" th:href="@{/kitchen/plan(week=${next})}" aria-label="Nächste Woche">›</a>
                <a class="button button-ghost button-small" th:unless="${monday == thisWeek}" th:href="@{/kitchen/plan}">Heute</a>
            </p>
        </div>
        <div class="page-actions" th:if="${canPlan}">
            <form method="post" th:action="@{/kitchen/plan/fill}">
                <input type="hidden" name="week" th:value="${monday}">
                <button type="submit" class="button">Woche auffüllen</button>
            </form>
        </div>
    </div>

    <p hidden data-toast="success" th:if="${success}" th:text="${success}"></p>
    <p hidden data-toast="error" th:if="${error}" th:text="${error}"></p>

    <div class="plan-week" th:attr="data-plan-board=${canPlan}">
        <section class="plan-day" th:each="d : ${days}" th:classappend="${d.today} ? 'plan-today'">
            <h2 class="plan-day-head">
                <span th:text="${d.weekday}">Mo</span>
                <span class="muted" th:text="${d.label}">12.10.</span>
            </h2>
            <div class="plan-slot" th:each="c : ${d.cells}"
                 th:attr="data-day=${d.date},data-slot=${c.slot.id}">
                <h3 th:text="${c.slot.name}">Abendessen</h3>
                <a class="meal-chip" th:each="m : ${c.meals}" th:href="@{/kitchen/plan/meals/{id}(id=${m.id})}"
                   th:classappend="${m.cooked} ? 'meal-cooked'" th:attr="data-meal-id=${m.id}">
                    <img th:if="${m.photoId != null}" th:src="@{/attachments/{id}(id=${m.photoId})}" alt="" loading="lazy">
                    <span class="meal-title" th:text="${m.title}">Nudeln</span>
                    <span class="meal-meta">
                        <span class="muted" th:if="${m.kcal}" th:text="${m.kcal}">600 kcal</span>
                        <span class="eaters">
                            <span class="eater" th:each="e : ${m.eaters}" th:title="${e.name}"
                                  th:style="|--member-color: ${e.color}|"><span th:text="${e.initial}">L</span><small th:text="${e.portions}"></small></span>
                        </span>
                    </span>
                </a>
                <button type="button" class="plan-add" th:if="${canPlan}" data-plan-pick
                        th:attr="data-day=${d.date},data-slot=${c.slot.id},data-label=|${d.weekday} ${d.label} · ${c.slot.name}|"
                        th:classappend="${#lists.isEmpty(c.meals)} ? 'plan-add-empty'"
                        th:aria-label="|${c.slot.name} hinzufügen|">+</button>
            </div>
            <ul class="balances" th:unless="${#lists.isEmpty(d.balances)}">
                <li th:each="b : ${d.balances}" th:classappend="${b.over} ? 'balance-over'"
                    th:style="|--member-color: ${b.color}; --p: ${b.percent}|">
                    <span class="balance-name" th:text="${b.name}">Lena</span>
                    <span class="balance-bar" aria-hidden="true"></span>
                    <span class="balance-text" th:text="${b.text}">600 / 2.000 kcal</span>
                </li>
            </ul>
        </section>
    </div>

    <dialog id="plan-pick" class="dialog" th:if="${canPlan}" aria-labelledby="plan-pick-title">
        <form method="post" th:action="@{/kitchen/plan/meals}" autocomplete="off">
            <input type="hidden" name="day">
            <input type="hidden" name="slotId">
            <input type="hidden" name="back" value="1">
            <div class="dialog-head">
                <h2 id="plan-pick-title" data-plan-pick-title>Rezept wählen</h2>
                <button type="button" class="icon-button" data-close-dialog>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    <span class="visually-hidden">Schließen</span>
                </button>
            </div>
            <div class="dialog-body">
                <input type="search" name="title" placeholder="Rezept suchen oder z. B. Reste eintippen"
                       aria-label="Rezept suchen" data-plan-filter>
                <ul class="plan-suggestions">
                    <li th:each="r : ${recipes}" th:attr="data-title=${#strings.toLowerCase(r.title)}">
                        <button type="submit" name="recipeId" th:value="${r.id}">
                            <span th:text="${r.title}">Pfannkuchen</span>
                            <span class="muted" th:text="${r.kcal}">529 kcal</span>
                        </button>
                    </li>
                </ul>
                <p class="hint" data-plan-empty hidden>Kein Rezept gefunden – mit Enter den Text als Eintrag übernehmen.</p>
            </div>
        </form>
    </dialog>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${isNew} ? 'Neuer Termin' : 'Termin')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='calendar')}"></header>
<main class="event-main">
    <a class="back-link" th:href="@{/calendar/month(date=${form.startDate})}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        Zum Kalender
    </a>
    <h1 th:text="${isNew} ? 'Neuer Termin' : (${canEdit} ? 'Termin bearbeiten' : ${form.title})">Neuer Termin</h1>

    <p class="notice notice-error" role="alert" th:if="${error}" th:text="${error}">Fehler</p>

    <form class="sheet event-form" th:action="@{${action}}" method="post" th:object="${form}" data-event-form>
        <fieldset class="event-fields" th:disabled="${!isNew and !canEdit}">
            <div class="field">
                <label for="title">Titel</label>
                <input id="title" class="input-title" type="text" th:field="*{title}" maxlength="200" required
                       placeholder="Was steht an?">
            </div>

            <div class="field-switch">
                <label class="switch">
                    <input type="checkbox" th:field="*{allDay}" data-allday-toggle>
                    <span class="switch-track" aria-hidden="true"></span>
                    Ganztägig
                </label>
            </div>

            <div class="field-row field-row-when">
                <div class="field">
                    <label for="startDate">Beginn</label>
                    <div class="date-time">
                        <input id="startDate" type="date" th:field="*{startDate}" required>
                        <input type="time" th:field="*{startTime}" aria-label="Uhrzeit Beginn" data-time-field>
                    </div>
                </div>
                <div class="field">
                    <label for="endDate">Ende</label>
                    <div class="date-time">
                        <input id="endDate" type="date" th:field="*{endDate}" required>
                        <input type="time" th:field="*{endTime}" aria-label="Uhrzeit Ende" data-time-field>
                    </div>
                </div>
            </div>

            <div class="field">
                <label for="repeat">Wiederholung</label>
                <select id="repeat" data-repeat-select>
                    <option value="">Keine</option>
                    <option value="FREQ=DAILY">Täglich</option>
                    <option value="FREQ=WEEKLY">Wöchentlich</option>
                    <option value="FREQ=WEEKLY;INTERVAL=2">Alle 2 Wochen</option>
                    <option value="FREQ=MONTHLY">Monatlich</option>
                    <option value="FREQ=YEARLY">Jährlich</option>
                    <option value="custom">Benutzerdefiniert …</option>
                </select>
                <input type="text" class="rrule-input" th:field="*{rrule}" maxlength="500" data-rrule-input
                       placeholder="z. B. FREQ=MONTHLY;BYDAY=-1FR" aria-label="Wiederholungsregel (iCal-RRULE)">
                <p class="hint rrule-hint" data-rrule-hint>Regel im iCal-Format (RRULE), z. B. FREQ=MONTHLY;BYDAY=-1FR für jeden letzten Freitag.</p>
            </div>

            <div class="field">
                <label for="location">Ort <span class="hint">optional</span></label>
                <input id="location" type="text" th:field="*{location}" maxlength="255">
            </div>
            <div class="field">
                <label for="description">Notizen <span class="hint">optional</span></label>
                <textarea id="description" th:field="*{description}" rows="3"></textarea>
            </div>

            <fieldset class="field choices" th:unless="${#lists.isEmpty(allMembers)}">
                <legend>Betrifft</legend>
                <label class="choice choice-member" th:each="m : ${allMembers}" th:style="|--member-color: ${m.color}|">
                    <input type="checkbox" name="memberIds" th:value="${m.id}"
                           th:checked="${form.memberIds.contains(m.id)}">
                    <span th:text="${m.name}">Name</span>
                </label>
            </fieldset>

            <div class="field-switch" sec:authorize="hasAuthority('CALENDAR_PRIVATE_CREATE')">
                <label class="switch">
                    <input type="checkbox" th:field="*{privateEvent}">
                    <span class="switch-track" aria-hidden="true"></span>
                    Privat
                </label>
                <p class="hint">Nur für dich und Administratoren sichtbar.</p>
            </div>
        </fieldset>

        <div class="form-actions" th:if="${isNew or canEdit}">
            <a class="button button-ghost" th:href="@{/calendar/month(date=${form.startDate})}">Abbrechen</a>
            <button type="submit" class="button" th:text="${isNew} ? 'Termin anlegen' : (${recurring} ? 'Ganze Serie speichern' : 'Änderungen speichern')">Speichern</button>
        </div>
    </form>

    <section class="sheet occurrence-panel" th:if="${occurrenceId != null and canEdit}">
        <h2>Nur dieses Vorkommen</h2>
        <p class="muted" th:if="${occurrence != null}"
           th:text="${#temporals.format(occurrence.start, 'EEEE, d. MMMM yyyy')}">Datum</p>
        <form th:if="${occurrence != null}" th:action="@{/calendar/events/{id}/occurrence(id=${event.id})}" method="post">
            <input type="hidden" name="recurrenceId" th:value="${occurrenceId}">
            <div class="field">
                <label for="occ-title">Titel</label>
                <input id="occ-title" type="text" name="title" th:value="${occurrence.title}" maxlength="200" required>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="occ-start">Beginn</label>
                    <input id="occ-start" type="datetime-local" name="start"
                           th:value="${#temporals.format(occurrence.start, 'yyyy-MM-dd''T''HH:mm')}" required>
                </div>
                <div class="field">
                    <label for="occ-end">Ende</label>
                    <input id="occ-end" type="datetime-local" name="end"
                           th:value="${#temporals.format(occurrence.end, 'yyyy-MM-dd''T''HH:mm')}" required>
                </div>
            </div>
            <div class="field">
                <label for="occ-location">Ort <span class="hint">optional</span></label>
                <input id="occ-location" type="text" name="location" th:value="${occurrence.location}" maxlength="255">
            </div>
            <div class="form-actions">
                <button type="submit" class="button">Vorkommen speichern</button>
            </div>
        </form>
        <form class="danger-zone" th:action="@{/calendar/events/{id}/occurrence/cancel(id=${event.id})}" method="post"
              data-confirm="Dieses Vorkommen absagen?" data-confirm-label="Absagen">
            <input type="hidden" name="recurrenceId" th:value="${occurrenceId}">
            <button type="submit" class="button button-ghost">Dieses Vorkommen absagen</button>
        </form>
    </section>

    <form class="danger-zone" th:if="${!isNew and canDelete}"
          th:action="@{/calendar/events/{id}/delete(id=${event.id})}" method="post"
          th:attr="data-confirm=${recurring} ? |Die ganze Serie „${event.title}“ löschen?| : |„${event.title}“ löschen?|">
        <button type="submit" class="button button-danger" th:text="${recurring} ? 'Ganze Serie löschen' : 'Termin löschen'">Termin löschen</button>
    </form>
</main>
<div th:replace="~{fragments/layout :: confirmDialog}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

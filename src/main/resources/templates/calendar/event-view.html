<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${details.occurrence.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='calendar')}"></header>
<main class="event-main" th:with="o=${details.occurrence}">
    <a class="back-link" th:href="@{/calendar/month(date=${o.start.toLocalDate()})}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        Zum Kalender
    </a>

    <article class="sheet event-view">
        <h1 th:text="${o.title}">Termin</h1>
        <p class="event-when" th:text="${details.when}">Montag, 12. Oktober 2026, 19:00–21:00 Uhr</p>

        <dl class="event-facts">
            <th:block th:if="${details.repeat != null}">
                <dt>Wiederholung</dt>
                <dd th:text="${details.repeat}">Wöchentlich</dd>
            </th:block>
            <th:block th:if="${o.location != null}">
                <dt>Ort</dt>
                <dd th:text="${o.location}">Aula</dd>
            </th:block>
            <th:block th:unless="${#sets.isEmpty(o.memberIds)}">
                <dt>Betrifft</dt>
                <dd class="event-members">
                    <th:block th:each="m : ${allMembers}">
                        <span class="member-chip" th:if="${o.memberIds.contains(m.id)}"
                              th:style="|--member-color: ${m.color}|" th:text="${m.name}">Name</span>
                    </th:block>
                </dd>
            </th:block>
            <th:block th:if="${o.privateEvent}">
                <dt>Sichtbarkeit</dt>
                <dd>Privat</dd>
            </th:block>
        </dl>

        <div class="event-notes" th:if="${o.description != null}">
            <h2>Notizen</h2>
            <p th:text="${o.description}">Notizen</p>
        </div>
    </article>

    <form class="danger-zone" th:if="${canDelete}"
          th:action="@{/calendar/events/{id}/delete(id=${event.id})}" method="post"
          th:attr="data-confirm=${recurring} ? |Die ganze Serie „${event.title}“ löschen?| : |„${event.title}“ löschen?|">
        <button type="submit" class="button button-danger" th:text="${recurring} ? 'Ganze Serie löschen' : 'Termin löschen'">Termin löschen</button>
    </form>
</main>
<div th:replace="~{fragments/layout :: confirmDialog}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meine Hausarbeiten')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='household')}"></header>
<main class="household-page">
    <div th:replace="~{household/fragments :: head('Meine Hausarbeiten', ${todayLabel})}"></div>

    <p hidden data-toast="success" th:if="${success}" th:text="${success}"></p>
    <p hidden data-toast="error" th:if="${error}" th:text="${error}"></p>

    <p class="notice" th:unless="${hasMember}">
        Dein Konto ist mit keinem Familienmitglied verknüpft. Ein Administrator kann das unter „Mitglieder“ erledigen.
    </p>

    <section class="chore-section is-overdue" th:unless="${#lists.isEmpty(overdue)}">
        <h2>Überfällig</h2>
        <ul class="chore-list">
            <th:block th:each="c : ${overdue}" th:with="showDay=true">
                <li th:replace="~{household/fragments :: chip}"></li>
            </th:block>
        </ul>
    </section>

    <section class="chore-section">
        <h2>Heute</h2>
        <ul class="chore-list" th:unless="${#lists.isEmpty(dueToday)}">
            <th:block th:each="c : ${dueToday}" th:with="showAssignee=true">
                <li th:replace="~{household/fragments :: chip}"></li>
            </th:block>
        </ul>
        <p class="sheet sheet-empty" th:if="${#lists.isEmpty(dueToday) and hasMember}">
            Heute steht für dich nichts mehr an.
        </p>
    </section>
</main>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Start')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='home')}"></header>
<main>
    <section class="greeting">
        <time th:datetime="${today}" th:text="${todayLabel}">Datum</time>
        <h1><span data-greeting>Hallo</span>, <span sec:authentication="name">benutzer</span>.</h1>
    </section>

    <ul class="areas" sec:authorize="hasAnyAuthority('USER_MANAGE', 'ACCESS_ROLE_MANAGE', 'MEMBER_MANAGE')">
        <li sec:authorize="hasAuthority('MEMBER_MANAGE')">
            <a class="area" th:href="@{/admin/members}">
                <span class="area-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>
                    </svg>
                </span>
                <h2>Familienmitglieder</h2>
                <p>Wer zur Familie gehört</p>
            </a>
        </li>
        <li sec:authorize="hasAuthority('USER_MANAGE')">
            <a class="area" th:href="@{/admin/users}">
                <span class="area-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="9" cy="8" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0"/>
                        <path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M18 14a6.5 6.5 0 0 1 3.5 5.5"/>
                    </svg>
                </span>
                <h2>Benutzer</h2>
                <p>Konten anlegen und Rollen vergeben</p>
            </a>
        </li>
        <li sec:authorize="hasAuthority('ACCESS_ROLE_MANAGE')">
            <a class="area" th:href="@{/admin/roles}">
                <span class="area-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3 4.5 6v5.5c0 4.5 3.2 8.2 7.5 9.5 4.3-1.3 7.5-5 7.5-9.5V6z"/><path d="m9 12 2 2 4-4"/>
                    </svg>
                </span>
                <h2>Rollen und Rechte</h2>
                <p>Festlegen, wer was darf</p>
            </a>
        </li>
    </ul>
    <p class="empty-home" sec:authorize="!hasAnyAuthority('USER_MANAGE', 'ACCESS_ROLE_MANAGE', 'MEMBER_MANAGE')">
        Hier erscheinen Kalender und weitere Bereiche, sobald sie eingerichtet sind.
    </p>
</main>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

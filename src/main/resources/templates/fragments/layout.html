<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' – Nestwerk'">Nestwerk</title>
    <meta name="color-scheme" content="light dark">
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <script>
        try {
            const t = localStorage.getItem('nestwerk-theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) { /* Speicher nicht verfügbar */ }
    </script>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">
    <meta name="theme-color" content="#3F5B45">
    <link rel="preload" as="font" type="font/woff2" crossorigin th:href="@{/fonts/bricolage-grotesque.woff2}">
    <link rel="stylesheet" th:href="@{/css/nestwerk.css}">
    <script defer th:src="@{/js/vendor/htmx.min.js}"></script>
    <script defer th:src="@{/js/nestwerk.js}"></script>
</head>
<body>

<svg th:fragment="nestmark" class="nestmark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    <ellipse class="nestmark-egg" cx="32" cy="27" rx="7.5" ry="9.5"/>
    <g class="nestmark-twigs">
        <path d="M7 31 Q32 22 57 31"/>
        <path d="M6 30 Q30 62 58 33"/>
        <path d="M9 37 Q36 58 57 28"/>
        <path d="M7 27 Q26 56 55 38"/>
        <path d="M13 42 Q32 50 51 42"/>
    </g>
</svg>

<header th:fragment="nav" class="topnav">
    <div class="topnav-inner">
        <a th:href="@{/}" class="brand">
            <svg th:replace="~{fragments/layout :: nestmark}"></svg>
            <span>Nestwerk</span>
        </a>

        <button type="button" class="icon-button nav-toggle" aria-expanded="false" aria-controls="main-nav"
                data-nav-toggle>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <span class="visually-hidden">Menü</span>
        </button>

        <nav id="main-nav" class="nav-links" aria-label="Hauptnavigation">
            <a th:href="@{/}" th:aria-current="${active == 'home'} ? 'page'">Start</a>
            <a th:href="@{/calendar}" sec:authorize="hasAuthority('CALENDAR_VIEW')"
               th:aria-current="${active == 'calendar'} ? 'page'">Kalender</a>
            <a th:href="@{/todos}" th:if="${@todoAccess.mayOpen(#authentication.name)}"
               th:aria-current="${active == 'todos'} ? 'page'">ToDos</a>
            <a th:href="@{/household}" th:if="${@householdAccess.mayOpen(#authentication.name)}"
               th:aria-current="${active == 'household'} ? 'page'">Haushalt</a>
            <a th:href="@{/contacts}" th:if="${@contactService.mayOpen(#authentication.name)}"
               th:aria-current="${active == 'contacts'} ? 'page'">Kontakte</a>
            <a th:href="@{/admin/users}" sec:authorize="hasAuthority('USER_MANAGE')"
               th:aria-current="${active == 'users'} ? 'page'">Benutzer</a>
            <a th:href="@{/admin/roles}" sec:authorize="hasAuthority('ACCESS_ROLE_MANAGE')"
               th:aria-current="${active == 'roles'} ? 'page'">Rollen</a>
            <a th:href="@{/admin/members}" sec:authorize="hasAuthority('MEMBER_MANAGE')"
               th:aria-current="${active == 'members'} ? 'page'">Mitglieder</a>
        </nav>

        <div class="nav-tools">
            <div class="menu bell" data-menu>
                <button type="button" class="icon-button bell-button" aria-expanded="false" aria-haspopup="true"
                        title="Benachrichtigungen" data-menu-toggle>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>
                    </svg>
                    <span class="visually-hidden">Benachrichtigungen</span>
                    <th:block th:with="count=${@notificationService.unreadCount(#authentication.name)}">
                        <span th:replace="~{notifications/fragments :: count}"></span>
                    </th:block>
                </button>
                <div class="menu-panel bell-panel" hidden data-menu-panel
                     th:hx-get="@{/notifications/menu}" hx-trigger="intersect" hx-swap="innerHTML">
                    <p class="muted bell-empty">Wird geladen …</p>
                </div>
            </div>
            <button type="button" class="icon-button" data-theme-toggle title="Farbschema wechseln">
                <svg class="theme-icon theme-icon-system" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/>
                </svg>
                <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>
                </svg>
                <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
                </svg>
                <span class="visually-hidden" data-theme-label>Farbschema: System</span>
            </button>

            <div class="menu" data-menu>
                <button type="button" class="avatar-button" aria-expanded="false" aria-haspopup="true"
                        data-menu-toggle>
                    <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">?</span>
                    <span class="visually-hidden">Benutzermenü</span>
                </button>
                <div class="menu-panel" hidden data-menu-panel>
                    <p class="menu-label">Angemeldet als<br><strong sec:authentication="name">benutzer</strong></p>
                    <a class="menu-item" th:href="@{/notifications}">Benachrichtigungen</a>
                    <a class="menu-item" th:href="@{/settings/notifications}">Meine Benachrichtigungswege</a>
                    <a class="menu-item" th:href="@{/settings/pin}"
                       th:if="${@householdAccess.mayOpen(#authentication.name)}">PIN fürs Tablet</a>
                    <a class="menu-item" th:href="@{/admin/notifications}"
                       sec:authorize="hasAuthority('NOTIFICATION_SETTINGS_MANAGE')">Benachrichtigungen einstellen</a>
                    <a class="menu-item" th:href="@{/admin/devices}"
                       sec:authorize="hasAuthority('HOUSEHOLD_DEVICE_MANAGE')">Wand-Tablets</a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="menu-item">Abmelden</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>

<button th:fragment="passwordToggle" type="button" class="icon-button" aria-pressed="false" data-password-toggle>
    <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3l18 18M10.6 5.6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.7M6.6 6.7A16.6 16.6 0 0 0 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
    </svg>
    <span class="visually-hidden">Passwort anzeigen</span>
</button>

<dialog th:fragment="confirmDialog" id="confirm-dialog" class="dialog dialog-small" aria-labelledby="confirm-title">
    <div class="dialog-body">
        <h2 id="confirm-title" data-confirm-text>Wirklich fortfahren?</h2>
        <p class="muted">Das lässt sich nicht rückgängig machen.</p>
    </div>
    <div class="dialog-foot">
        <button type="button" class="button button-ghost" data-close-dialog>Abbrechen</button>
        <button type="button" class="button button-danger" data-confirm-ok>Löschen</button>
    </div>
</dialog>

<div th:fragment="toasts" class="toasts" aria-live="polite" data-toasts></div>

</body>
</html>

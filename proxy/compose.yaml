# Zentraler Reverse Proxy für alle Dienste auf dem Server: nginx-proxy verteilt nach Domain (VIRTUAL_HOST der
# Container im Netz „proxy“), acme-companion holt und erneuert Let's-Encrypt-Zertifikate (LETSENCRYPT_HOST).
#
# Einen weiteren Dienst anhängen: Container ins externe Netz „proxy“ und
#   VIRTUAL_HOST=dienst.example.org, VIRTUAL_PORT=<Port im Container>, LETSENCRYPT_HOST=dienst.example.org
# setzen. Eigene nginx-Einstellungen je Domain gehören in vhost.d/<domain>.
services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.7
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - ./vhost.d:/etc/nginx/vhost.d
    networks:
      - proxy

  acme-companion:
    image: nginxproxy/acme-companion:2.5
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - ./vhost.d:/etc/nginx/vhost.d
      - acme:/etc/acme.sh
    networks:
      - proxy

volumes:
  certs:
  html:
  acme:

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}

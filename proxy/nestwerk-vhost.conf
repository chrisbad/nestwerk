# Vorlage für proxy/vhost.d/<nestwerk-domain>: install.sh kopiert sie unter dem Domainnamen dorthin.
# Sicherungen werden hochgeladen und beim Wiederherstellen synchron eingespielt: große Dateien, lange Laufzeit.
client_max_body_size 4g;
proxy_request_buffering off;
proxy_read_timeout 900s;
proxy_send_timeout 900s;

# Während eines Updates startet Nestwerk neu: statt „502 Bad Gateway“ eine Seite, die sich selbst neu lädt.
error_page 502 503 504 = @nestwerk_wartung;
location @nestwerk_wartung {
    default_type text/html;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    return 503 '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><title>Nestwerk wird aktualisiert</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:#08080d;color:#f1f1f7;font-family:system-ui,sans-serif;text-align:center}h1{font-size:1.6rem}p{color:#9c9cb4}</style></head><body><main><h1>Nestwerk wird aktualisiert …</h1><p>Gleich geht es weiter. Die Seite lädt sich selbst neu.</p></main></body></html>';
}

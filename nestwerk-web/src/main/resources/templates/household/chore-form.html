<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isNew} ? 'Neue Hausarbeit' : 'Hausarbeit bearbeiten')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='household')}"></header>
<main class="event-main">
    <a class="back-link" th:href="${isNew} ? @{/household/chores} : @{/household/chores/{id}(id=${chore.id})}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        Zurück
    </a>
    <h1 th:text="${isNew} ? 'Neue Hausarbeit' : 'Hausarbeit bearbeiten'">Neue Hausarbeit</h1>

    <p class="notice notice-error" role="alert" th:if="${error}" th:text="${error}">Fehler</p>

    <form class="sheet event-form" th:action="@{${action}}" method="post" th:object="${form}" data-event-form
          data-chore-form>
        <th:block th:replace="~{household/fragments :: chore-fields}"></th:block>

        <div class="form-actions">
            <a class="button button-ghost" th:href="${isNew} ? @{/household/chores} : @{/household/chores/{id}(id=${chore.id})}">Abbrechen</a>
            <button type="submit" class="button" th:text="${isNew} ? 'Hausarbeit anlegen' : 'Änderungen speichern'">Speichern</button>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

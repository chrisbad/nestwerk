<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Haushalt einstellen')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='household')}"></header>
<main class="household-page">
    <div th:replace="~{household/fragments :: head('Einstellungen', null)}"></div>

    <p hidden data-toast="success" th:if="${success}" th:text="${success}"></p>
    <p hidden data-toast="error" th:if="${error}" th:text="${error}"></p>

    <section class="sheet settings-block">
        <h2>Personentag</h2>
        <p class="muted">Länge eines Personentags (PT) in Stunden. Die Auswertung rechnet damit, wenn sie den Aufwand
            in Personentagen zeigt.</p>
        <form method="post" th:action="@{/household/settings}" class="slot-row">
            <label class="slot-share">
                <input type="number" name="hoursPerPersonDay" min="0.5" th:max="${maxHours}" step="0.5"
                       th:value="${hoursPerPersonDay}" th:disabled="${!canManage}" required aria-label="Stunden pro Personentag">
                Stunden pro Personentag
            </label>
            <button type="submit" class="button button-small" th:if="${canManage}">Speichern</button>
        </form>
        <p class="hint" th:unless="${canManage}">Du darfst diese Einstellung nur ansehen.</p>
    </section>
</main>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

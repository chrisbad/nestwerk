<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Familienmitglieder')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='members')}"></header>
<main>
    <div class="page-head">
        <div>
            <h1>Familienmitglieder</h1>
            <p>Wer zur Familie gehört. Termine und Aufgaben werden Mitgliedern zugewiesen.</p>
        </div>
        <div class="page-actions">
            <button type="button" class="button" data-open-dialog="create-member">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Mitglied anlegen
            </button>
        </div>
    </div>

    <p hidden data-toast="success" th:if="${success}" th:text="${success}"></p>
    <p hidden data-toast="error" th:if="${error}" th:text="${error}"></p>

    <div class="table-tools" data-table-for="members" th:unless="${#lists.isEmpty(members)}">
        <label class="search">
            <span class="visually-hidden">Mitglied suchen</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input class="input" type="search" placeholder="Suchen" data-table-search autocomplete="off">
        </label>
        <label class="field field-inline">
            <span>Konto</span>
            <select data-table-select="account">
                <option value="">Alle</option>
                <option value="LINKED">Mit Konto</option>
                <option value="NONE">Ohne Konto</option>
            </select>
        </label>
        <p class="table-count muted" data-table-count aria-live="polite"></p>
        <button type="button" class="button button-ghost button-small" data-table-reset hidden>Filter zurücksetzen</button>
    </div>
    <div class="sheet" th:unless="${#lists.isEmpty(members)}">
        <table class="table data-table" data-table="members" data-table-persist data-sort-default="name">
            <thead>
            <tr>
                <th scope="col" data-col="name" data-sort="text">Mitglied</th>
                <th scope="col" data-col="user" data-sort="text">Konto</th>
                <th scope="col" data-col="pin" data-sort="text">Tablet-PIN</th>
                <th scope="col"><span class="visually-hidden">Aktion</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${members}" class="drawer-row"
                th:attr="data-filter-account=${m.userId != null} ? 'LINKED' : 'NONE', data-drawer-url=@{/admin/members/{id}/edit(id=${m.id})}, data-drawer-title=${m.name}">
                <td data-col="name" data-label="Mitglied" th:attr="data-value=${m.name}">
                    <span class="person">
                        <span class="avatar" aria-hidden="true" th:style="|background-color: ${m.color}|"
                              th:text="${#strings.toUpperCase(#strings.substring(m.name, 0, 1))}">A</span>
                        <span th:text="${m.name}">Name</span>
                    </span>
                </td>
                <td data-col="user" data-label="Konto"
                    th:attr="data-value=${m.userId != null} ? ${accountNames[m.userId]} : ''"
                    th:text="${m.userId != null} ? ${accountNames[m.userId]} : 'Ohne Konto'">Konto</td>
                <td data-col="pin" data-label="Tablet-PIN" th:text="${m.hasPin()} ? 'eingerichtet' : 'keine'">keine</td>
                <td class="cell-actions">
                    <button type="button" class="button button-ghost button-small"
                            th:attr="data-drawer-url=@{/admin/members/{id}/edit(id=${m.id})}, data-drawer-title=${m.name}">Bearbeiten</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="muted table-empty" data-table-empty="members" hidden>Kein Mitglied passt zur Suche.</p>
    <div class="sheet sheet-empty" th:if="${#lists.isEmpty(members)}">
        Noch keine Mitglieder. Lege die Familie über „Mitglied anlegen“ an.
    </div>
</main>

<dialog id="create-member" class="dialog" aria-labelledby="create-member-title">
    <form th:action="@{/admin/members}" method="post">
        <div class="dialog-head">
            <h2 id="create-member-title">Mitglied anlegen</h2>
            <button type="button" class="icon-button" data-close-dialog>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                <span class="visually-hidden">Schließen</span>
            </button>
        </div>
        <div class="dialog-body">
            <div class="field-row field-row-color">
                <div class="field">
                    <label for="new-member-name">Name</label>
                    <input id="new-member-name" type="text" name="name" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="new-member-color">Farbe</label>
                    <input id="new-member-color" class="color-input" type="color" name="color" value="#5b8c6a">
                </div>
            </div>
            <div class="field">
                <label for="new-member-user">Benutzerkonto <span class="hint">optional</span></label>
                <select id="new-member-user" name="userId">
                    <option value="">Kein Konto</option>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}">konto</option>
                </select>
            </div>
        </div>
        <div class="dialog-foot">
            <button type="button" class="button button-ghost" data-close-dialog>Abbrechen</button>
            <button type="submit" class="button">Mitglied anlegen</button>
        </div>
    </form>
</dialog>

<div th:replace="~{fragments/layout :: confirmDialog}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

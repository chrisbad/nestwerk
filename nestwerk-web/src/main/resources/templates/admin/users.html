<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Benutzerverwaltung')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='users')}"></header>
<main>
    <div class="page-head">
        <div>
            <h1>Benutzer</h1>
            <p>Wer sich bei Nestwerk anmelden kann.</p>
        </div>
        <div class="page-actions" data-table-for="users">
            <label class="search">
                <span class="visually-hidden">Benutzer suchen</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
                <input class="input" type="search" placeholder="Suchen" data-table-search autocomplete="off">
            </label>
            <button type="button" class="button" data-open-dialog="create-user">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Benutzer anlegen
            </button>
        </div>
    </div>

    <div id="users-panel" th:fragment="panel">
        <p hidden data-toast="success" th:if="${success}" th:text="${success}"></p>
        <p hidden data-toast="error" data-form-error th:if="${error}" th:text="${error}"></p>

        <div class="sheet">
            <table class="table data-table" id="users-table" data-table="users" data-table-persist data-sort-default="name"
                   th:unless="${#lists.isEmpty(users)}">
                <thead>
                <tr>
                    <th scope="col" data-col="name" data-sort="text">Name</th>
                    <th scope="col" data-col="roles" data-sort="text">Rollen</th>
                    <th scope="col" data-col="status" data-sort="text">Status</th>
                    <th scope="col"><span class="visually-hidden">Aktionen</span></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}" th:classappend="${user.username == created} ? 'is-new'">
                    <td data-col="name" data-label="Name" th:attr="data-value=${user.username}">
                        <span class="person">
                            <span class="avatar" aria-hidden="true"
                                  th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 1))}">A</span>
                            <span th:text="${user.username}">admin</span>
                        </span>
                    </td>
                    <td data-col="roles" data-label="Rollen"
                        th:attr="data-value=${#strings.listJoin(#lists.sort(user.roles.![name]), ', ')}">
                        <span class="badges">
                            <span th:each="r : ${user.roles}" class="badge"
                                  th:classappend="${r.allPermissions} ? 'badge-admin'" th:text="${r.name}">Rolle</span>
                            <span th:if="${#sets.isEmpty(user.roles)}" class="muted">Keine Rolle</span>
                        </span>
                    </td>
                    <td data-col="status" data-label="Status" th:attr="data-value=${user.enabled} ? 'ACTIVE' : 'DISABLED'">
                        <span class="status" th:if="${user.enabled}">Aktiv</span>
                        <span class="status status-off" th:unless="${user.enabled}">Deaktiviert</span>
                    </td>
                    <td class="cell-actions">
                        <button type="button" class="button button-ghost button-small"
                                th:attr="data-drawer-url=@{/admin/users/{id}/edit(id=${user.id})}, data-drawer-title=${user.username}">Bearbeiten</button>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="filter-empty" hidden data-table-empty="users">Kein Benutzer passt zur Suche.</p>
            <p class="sheet-empty" th:if="${#lists.isEmpty(users)}">
                Noch keine Benutzer. Lege das erste Konto über „Benutzer anlegen“ an.
            </p>
        </div>

    </div>
</main>

<dialog id="create-user" class="dialog" aria-labelledby="create-user-title">
    <form th:action="@{/admin/users}" method="post"
          th:hx-post="@{/admin/users}"
          hx-target="#users-panel" hx-swap="outerHTML">
        <div class="dialog-head">
            <h2 id="create-user-title">Benutzer anlegen</h2>
            <button type="button" class="icon-button" data-close-dialog>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                <span class="visually-hidden">Schließen</span>
            </button>
        </div>
        <div class="dialog-body">
            <p class="notice notice-error" role="alert" hidden data-dialog-error></p>
            <div class="field">
                <label for="new-username">Benutzername</label>
                <input id="new-username" type="text" name="username" maxlength="100" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="new-password">Passwort <span class="hint">mindestens 8 Zeichen</span></label>
                <div class="password">
                    <input id="new-password" type="password" name="password" minlength="8"
                           autocomplete="new-password" required>
                    <button th:replace="~{fragments/layout :: passwordToggle}"></button>
                </div>
            </div>
            <fieldset class="field choices">
                <legend>Rollen</legend>
                <label class="choice" th:each="r : ${roles}">
                    <input type="checkbox" name="roleIds" th:value="${r.id}" th:checked="${r.name == 'Benutzer'}">
                    <span th:text="${r.name}">Rolle</span>
                </label>
            </fieldset>
        </div>
        <div class="dialog-foot">
            <button type="button" class="button button-ghost" data-close-dialog>Abbrechen</button>
            <button type="submit" class="button">Benutzer anlegen</button>
        </div>
    </form>
</dialog>

<div th:replace="~{fragments/layout :: confirmDialog}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Toolbar: title, paging, choice of view, grid snapping, new event -->
<div th:fragment="toolbar(title, view, date, prevUrl, todayUrl, nextUrl)" class="cal-toolbar"
     th:with="here=${view == 'agenda'} ? @{/calendar/agenda(from=${date})} : @{/calendar/{v}(v=${view}, date=${date})}">
    <div class="cal-title">
        <h1 th:text="${title}">Oktober 2026</h1>
        <div class="cal-step" hx-boost="true" hx-target="#calendar" hx-select="#calendar" hx-swap="outerHTML">
            <a class="icon-button" th:href="${prevUrl}" title="Zurück" data-swipe-prev>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
                <span class="visually-hidden">Zurück</span>
            </a>
            <a class="button button-ghost button-small" th:href="${todayUrl}">Heute</a>
            <a class="icon-button" th:href="${nextUrl}" title="Weiter" data-swipe-next>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                <span class="visually-hidden">Weiter</span>
            </a>
        </div>
    </div>
    <div class="cal-actions">
        <button type="button" class="button button-ghost button-small cal-todo-toggle" th:if="${showTodos}"
                data-toggle-todos aria-pressed="true" title="Fällige ToDos im Kalender ein- oder ausblenden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg>
            ToDos
        </button>
        <div class="segmented segmented-slots" role="group" aria-label="Raster" th:if="${gridDays != null}">
            <button type="button" data-slot-choice="coarse" aria-pressed="true"
                    th:title="|Grob: rastet auf ${slotCoarse} Minuten ein|">Grob</button>
            <button type="button" data-slot-choice="fine" aria-pressed="false"
                    th:title="|Fein: rastet auf ${slotFine} Minuten ein|">Fein</button>
        </div>
        <div class="segmented segmented-zoom" role="group" aria-label="Zoom" th:if="${gridDays != null or view == 'month'}">
            <button type="button" data-zoom-step="-1" title="Verkleinern (Strg + Mausrad)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4M8 11h6"/></svg>
                <span class="visually-hidden">Verkleinern</span>
            </button>
            <span class="zoom-level" data-zoom-label aria-live="polite">100 %</span>
            <button type="button" data-zoom-step="1" title="Vergrößern (Strg + Mausrad)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4M8 11h6M11 8v6"/></svg>
                <span class="visually-hidden">Vergrößern</span>
            </button>
        </div>
        <button type="button" class="button button-ghost button-small cal-split-toggle" th:if="${gridDays != null}"
                data-split-toggle th:attr="aria-pressed=${splitByPerson}"
                title="Für jede Person eine eigene Spalte – Einträge lassen sich zwischen Personen ziehen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M3 19c0-3 2.2-5 5-5s5 2 5 5M13.5 19c.2-2.6 1.6-4.2 3.5-4.2S20.8 16.4 21 19"/></svg>
            Nach Personen
        </button>
        <nav class="segmented" aria-label="Ansicht" hx-boost="true" hx-target="#calendar" hx-select="#calendar" hx-swap="outerHTML">
            <a th:href="@{/calendar/day(date=${date})}" th:aria-current="${view == 'day'} ? 'page'">Tag</a>
            <a th:href="@{/calendar/days3(date=${date})}" th:aria-current="${view == 'days3'} ? 'page'">3 Tage</a>
            <a class="segment-week" th:href="@{/calendar/week(date=${date})}" th:aria-current="${view == 'week'} ? 'page'">Woche</a>
            <a th:href="@{/calendar/month(date=${date})}" th:aria-current="${view == 'month'} ? 'page'">Monat</a>
            <a th:href="@{/calendar/agenda(from=${date})}" th:aria-current="${view == 'agenda'} ? 'page'">Agenda</a>
        </nav>
        <!-- plain links: the toolbar is replaced by htmx when paging -->
        <a class="button button-ghost button-small" th:href="@{/export/calendar.ics}"
           title="Alle sichtbaren Termine als iCal-Datei herunterladen">Export</a>
        <a class="button button-ghost button-small" th:href="@{/import/calendar}"
           sec:authorize="hasAuthority('CALENDAR_EVENT_CREATE')" title="Termine aus einer iCal-Datei übernehmen">Import</a>
        <a class="button" th:href="@{/calendar/events/new(date=${date}, back=${here})}"
           sec:authorize="hasAuthority('CALENDAR_EVENT_CREATE')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Termin
        </a>
    </div>
</div>

<!-- Dialog of a tapped entry (event, chore or to-do); its content is loaded on tap -->
<dialog th:fragment="sheetDialog" id="calendar-sheet" class="dialog" aria-label="Eintrag">
    <div data-sheet-body></div>
</dialog>

<!-- Blocker and school bands of a day -->
<ul th:fragment="bands(list, compact)" class="bands" th:classappend="${compact} ? 'bands-compact'"
    th:if="${list != null and !list.isEmpty()}">
    <li th:each="b : ${list}" class="band" th:classappend="'band-' + ${b.kind}"
        th:style="${b.color != null} ? |--band-color: ${b.color}|" th:attr="title=|${b.label}, ${b.times}|">
        <span class="band-times" th:text="${b.times}">08:00–16:00</span>
        <span class="band-label" th:text="${b.label}">Lena · Arbeit</span>
    </li>
</ul>

<!-- Legend: categories colour the events, members appear as dots -->
<div th:fragment="calendarLegend" class="cal-legend-row">
    <ul class="cal-legend" th:unless="${#maps.isEmpty(categoryById)}" aria-label="Kategorien">
        <li th:each="entry : ${categoryById}">
            <span class="swatch" th:style="|background-color: ${entry.value.color.hex()}|"></span>
            <span th:text="${entry.value.name}">Arzt</span>
        </li>
    </ul>
    <ul class="cal-legend cal-legend-members" th:unless="${#maps.isEmpty(memberById)}" aria-label="Familienmitglieder">
        <li th:each="entry : ${memberById}">
            <span class="swatch swatch-round" th:style="|background-color: ${entry.value.color}|"></span>
            <span th:text="${entry.value.name}">Name</span>
        </li>
    </ul>
    <a class="cal-legend-manage" th:if="${canManageCategories}" th:href="@{/calendar/categories}">Kategorien verwalten</a>
</div>

<!-- A due to-do as all-day entry with check mark -->
<a th:fragment="todo(t)" class="occ occ-allday occ-todo" th:href="@{/todos/{id}(id=${t.id})}"
   th:attr="data-sheet-url=@{/calendar/todos/{id}/sheet(id=${t.id})}"
   th:classappend="'occ-todo-' + ${#strings.toLowerCase(t.priority.name())}" th:title="${t.title}">
    <span class="occ-title">
        <svg class="occ-lock" viewBox="0 0 24 24" role="img" aria-label="ToDo">
            <rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/>
        </svg>
        <span th:text="${t.title}">Steuer</span>
    </span>
</a>

<!-- A planned chore; colour of the responsible person -->
<a th:fragment="chore(c)" class="occ occ-chore" th:href="@{/household/tasks/{id}(id=${c.id})}"
   th:attr="data-sheet-url=@{/calendar/chores/{id}/sheet(id=${c.id})}"
   th:style="${c.color != null} ? |--occ-color: ${c.color}|" th:title="|${c.time} ${c.title}|">
    <span class="occ-time" th:text="${c.time}">18:30–18:55</span>
    <span class="occ-title">
        <svg class="occ-lock" viewBox="0 0 24 24" role="img" aria-label="Hausarbeit">
            <path d="M4.5 20V10l7.5-6 7.5 6v10z"/><path d="M9.5 20v-5h5v5"/>
        </svg>
        <span th:text="${c.title}">Bad putzen · Lena</span>
    </span>
</a>

<!-- An occurrence as entry; colour of its category, else of the first member -->
<a th:fragment="occurrence(o)" class="occ"
   th:classappend="${o.allDay} ? 'occ-allday'"
   th:with="category=${o.categoryId == null ? null : categoryById[o.categoryId]},
            firstMember=${#sets.isEmpty(o.memberIds) ? null : memberById[o.memberIds.iterator().next()]},
            color=${category != null ? category.color.hex() : (firstMember != null ? firstMember.color : null)}"
   th:style="${color != null} ? |--occ-color: ${color}|"
   th:title="${o.allDay} ? ${o.title} : |${#temporals.format(o.start, 'HH:mm')} ${o.title}|"
   th:href="@{/calendar/events/{id}(id=${o.eventId}, occurrence=${o.recurring} ? ${o.recurrenceId} : null)}"
   th:attr="data-event-id=${o.eventId}, data-start=${#temporals.format(o.start, 'yyyy-MM-dd')},
            data-sheet-url=@{/calendar/events/{id}/sheet(id=${o.eventId}, occurrence=${o.recurring} ? ${o.recurrenceId} : null)},
            data-movable=${!o.recurring and #authorization.expression('hasAnyAuthority(''CALENDAR_EVENT_EDIT_OWN'', ''CALENDAR_EVENT_EDIT_ALL'')')} ? 'true' : null">
    <span class="occ-time" th:unless="${o.allDay}" th:text="${#temporals.format(o.start, 'HH:mm')}">10:00</span>
    <span class="occ-title">
        <svg th:if="${o.privateEvent}" class="occ-lock" viewBox="0 0 24 24" aria-label="Privat" role="img">
            <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
        <span th:text="${o.title}">Titel</span>
    </span>
    <span th:replace="~{calendar/fragments :: memberDots(${o.memberIds}, ${category != null})}"></span>
</a>

<!-- Member dots; with a category all members are shown, otherwise only from two on (the colour is the first) -->
<span th:fragment="memberDots(ids, always)" class="occ-members"
      th:if="${#sets.size(ids) > 1 or (always and #sets.size(ids) > 0)}">
    <span th:each="mid : ${ids}" class="dot"
          th:if="${memberById[mid] != null}"
          th:style="|background-color: ${memberById[mid].color}|"
          th:title="${memberById[mid].name}"></span>
</span>

<!-- Colour choice from the fixed palette -->
<fieldset th:fragment="palette(selected)" class="field palette">
    <legend>Farbe</legend>
    <label class="palette-option" th:each="color : ${T(club.badernet.nestwerk.calendar.CategoryColor).values()}"
           th:style="|--swatch: ${color.hex()}|" th:title="${color.label()}">
        <input type="radio" name="color" th:value="${color.name()}" th:checked="${color == selected}" required>
        <span class="palette-dot" aria-hidden="true"></span>
        <span class="palette-label" th:text="${color.label()}">Rot</span>
    </label>
</fieldset>

<!-- Category choice for event forms -->
<div th:fragment="categorySelect(id, selected)" class="field" th:unless="${#lists.isEmpty(allCategories)}">
    <label th:for="${id}">Kategorie <span class="hint">optional</span></label>
    <select th:id="${id}" name="categoryId" data-category-select>
        <option value="">Keine</option>
        <option th:each="c : ${allCategories}" th:value="${c.id}" th:text="${c.name}"
                th:selected="${selected != null and selected == c.id}"
                th:attr="data-color=${c.color.hex()}">Arzt</option>
    </select>
</div>

</body>
</html>

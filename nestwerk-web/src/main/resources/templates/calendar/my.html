<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kalender')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav(active='calendar')}"></header>
<main class="cal-main cal-main-list" id="calendar" data-swipe-area>
    <p hidden data-toast="success" th:if="${success}" th:text="${success}"></p>
    <p hidden data-toast="error" th:if="${error}" th:text="${error}"></p>
    <div th:replace="~{calendar/fragments :: toolbar(${title}, 'my', ${focus},
            @{/calendar/my(date=${prev})}, @{/calendar/my(date=${today})}, @{/calendar/my(date=${next})})}"></div>
    <ul th:replace="~{calendar/fragments :: calendarLegend}"></ul>

    <p class="notice" role="status" th:unless="${day.memberLinked}">
        Dein Konto ist keinem Familienmitglied zugeordnet. Hier erscheinen deshalb nur Termine, die du selbst ohne
        Personen angelegt hast, und deine ToDos.
    </p>

    <div class="sheet sheet-empty" th:if="${day.empty}">
        Für diesen Tag steht nichts für dich an.
    </div>

    <section class="my-day-section" th:unless="${#lists.isEmpty(day.overdue)}" aria-labelledby="my-overdue">
        <h2 id="my-overdue" class="my-day-heading">Überfällig</h2>
        <div class="day-events">
            <th:block th:each="entry : ${day.overdue}">
                <th:block th:replace="~{calendar/fragments :: myEntry(${entry})}"></th:block>
            </th:block>
        </div>
    </section>

    <section class="my-day-section" th:unless="${#lists.isEmpty(day.entries)}" aria-labelledby="my-today">
        <h2 id="my-today" class="my-day-heading"
            th:text="${focus == today} ? 'Heute' : ${#temporals.format(focus, 'EEEE')}">Heute</h2>
        <div class="day-events">
            <th:block th:each="entry : ${day.entries}">
                <th:block th:replace="~{calendar/fragments :: myEntry(${entry})}"></th:block>
            </th:block>
        </div>
    </section>

    <div th:replace="~{calendar/fragments :: sheetDialog}"></div>
</main>
<div th:replace="~{fragments/layout :: confirmDialog}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>

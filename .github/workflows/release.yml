# Baut, testet und veröffentlicht das Docker-Image nach ghcr.io/chrisbad/nestwerk.
#   Push auf main      → Tags „main“ und „sha-<sha7>“ (Vorabversion; der feste Tag erlaubt Updates und Rückfall)
#   Tag v1.2.3         → Tags „1.2.3“, „1.2“ und „latest“ plus GitHub-Release mit Installationspaket
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Actions sind auf Commit-SHAs gepinnt (Version als Kommentar); Rechte nur dort, wo ein Job sie braucht.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  UPDATER_IMAGE: ghcr.io/${{ github.repository }}-updater

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Tests (Testcontainers nutzt das Docker des Runners)
        run: ./mvnw -B verify

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Skripte prüfen (shellcheck ist auf den Runnern installiert)
        run: shellcheck install.sh update.sh updater/updater.sh

  image:
    needs: [test, shellcheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version bestimmen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.app }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: meta-updater
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.UPDATER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Updater-Image (gleiche Tags wie die App)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Installationspaket packen
        run: |
          mkdir -p dist/nestwerk
          cp install.sh update.sh compose.prod.yaml compose.proxy.yaml .env.example dist/nestwerk/
          mkdir -p dist/nestwerk/proxy/vhost.d
          cp proxy/compose.yaml proxy/nestwerk-vhost.conf dist/nestwerk/proxy/
          chmod +x dist/nestwerk/install.sh dist/nestwerk/update.sh
          sed -i "s/^VERSION=\"\${NESTWERK_VERSION:-latest}\"/VERSION=\"\${NESTWERK_VERSION:-${GITHUB_REF_NAME#v}}\"/" \
            dist/nestwerk/install.sh
          tar -C dist -czf "nestwerk-install-${GITHUB_REF_NAME}.tar.gz" nestwerk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: nestwerk-install-*.tar.gz
          generate_release_notes: true

# Nestwerk im Serverbetrieb. Ergänzungen:
#   compose.proxy.yaml  – hinter dem zentralen nginx-proxy (proxy/compose.yaml) mit Let's-Encrypt-Zertifikat
#   compose.build.yaml  – Image lokal aus dem Quelltext bauen statt von ghcr.io laden
# Welche Dateien gelten, steht in der .env als COMPOSE_FILE (das Installationsskript setzt das).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nestwerk}
      POSTGRES_USER: ${POSTGRES_USER:-nestwerk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${NESTWERK_IMAGE:-ghcr.io/chrisbad/nestwerk}:${NESTWERK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nestwerk}
      DB_USER: ${POSTGRES_USER:-nestwerk}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      NESTWERK_ADMIN_USERNAME: ${NESTWERK_ADMIN_USERNAME:-admin}
      NESTWERK_ADMIN_PASSWORD: ${NESTWERK_ADMIN_PASSWORD:-}
      NESTWERK_SECRET_KEY: ${NESTWERK_SECRET_KEY:-}
      NESTWERK_TIMEZONE: ${NESTWERK_TIMEZONE:-Europe/Berlin}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      NESTWERK_ATTACHMENT_DIR: /data/attachments
      NESTWERK_BACKUP_DIR: /data/backups
      NESTWERK_EXTERNAL_BACKUP_DIR: /data/external
      NESTWERK_BASE_URL: ${NESTWERK_BASE_URL:-http://localhost:8080}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "${APP_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - attachments:/data/attachments
      - backups:/data/backups
      - updater:/data/updater
      # externe Platte für Sicherungen; ohne Angabe ein Verzeichnis neben dieser Datei
      - ${NESTWERK_EXTERNAL_BACKUP_HOST_DIR:-./external-backup}:/data/external
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Spielt Updates ein, die ein Admin in Nestwerk beauftragt (Aufträge über das Volume „updater“). Braucht den
  # Docker-Socket und das Installationsverzeichnis unter demselben Pfad wie auf dem Host, damit relative Pfade in
  # diesen Dateien stimmen. Neue Variablen in den Compose-Dateien brauchen immer einen Standardwert: .env wird bei
  # einem Update nur bei NESTWERK_VERSION geändert.
  updater:
    image: ${NESTWERK_IMAGE:-ghcr.io/chrisbad/nestwerk}-updater:${NESTWERK_VERSION:-latest}
    restart: unless-stopped
    environment:
      NESTWERK_DIR: ${NESTWERK_DIR:-/opt/nestwerk}
    working_dir: ${NESTWERK_DIR:-/opt/nestwerk}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NESTWERK_DIR:-/opt/nestwerk}:${NESTWERK_DIR:-/opt/nestwerk}
      # Anmeldung des Hosts bei ghcr.io (privates Image)
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/root/.docker:ro
      - updater:/work

volumes:
  db-data:
  attachments:
  backups:
  updater:
